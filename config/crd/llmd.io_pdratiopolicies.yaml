---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: pdratiopolicies.llmd.io
spec:
  group: llmd.io
  names:
    kind: PDRatioPolicy
    listKind: PDRatioPolicyList
    plural: pdratiopolicies
    shortNames:
    - pdrp
    singular: pdratiopolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gpuBudget
      name: GPU Budget
      type: integer
    - jsonPath: .status.currentPrefillReplicas
      name: Prefill
      type: integer
    - jsonPath: .status.currentDecodeReplicas
      name: Decode
      type: integer
    - jsonPath: .status.lastBottleneck
      name: Bottleneck
      type: string
    - jsonPath: .status.lastScaleTime
      name: Last Scale
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PDRatioPolicy is the Schema for the pdratiopolicies API.
          It coordinates prefill and decode replica counts within a fixed GPU budget,
          reacting to queue velocity spikes, TPOT SLO breaches, and KV cache pressure.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PDRatioPolicySpec defines the desired configuration for P/D
              ratio coordination.
            properties:
              cooldownSeconds:
                default: 120
                description: |-
                  CooldownSeconds is the minimum time between consecutive scale actions.
                  Prevents oscillation. Default: 120.
                format: int32
                type: integer
              decode:
                description: Decode holds configuration for the decode worker pool.
                properties:
                  deployment:
                    description: |-
                      Deployment is the name of the decode Deployment managed by llm-d.
                      Example: ms-pd-llm-d-modelservice-decode
                    type: string
                  kvCacheThreshold:
                    default: "0.85"
                    description: |-
                      KVCacheThreshold is the KV cache utilization threshold (0.0-1.0).
                      When decode pods exceed this, they risk OOM → add decode replica.
                      Default: 0.85.
                    type: string
                  max:
                    description: Max is the maximum replica count.
                    format: int32
                    minimum: 1
                    type: integer
                  min:
                    default: 1
                    description: Min is the minimum replica count. Must be >= 1.
                    format: int32
                    minimum: 1
                    type: integer
                  tpotSLOMs:
                    default: 80
                    description: |-
                      TpotSLOMs is the TPOT p95 SLO in milliseconds.
                      When TPOT p95 exceeds this, decode is the bottleneck → add decode replica.
                      Default: 80ms.
                    format: int32
                    type: integer
                required:
                - deployment
                - max
                - min
                type: object
              drainTimeoutSeconds:
                default: 30
                description: |-
                  DrainTimeoutSeconds is how long to wait for in-flight decode sequences
                  to complete before terminating a decode pod during scale-down.
                  Default: 30.
                format: int32
                type: integer
              dynamicThreshold:
                description: DynamicThreshold controls automatic PD_PROMPT_LEN_THRESHOLD
                  adjustment.
                properties:
                  enabled:
                    default: false
                    description: Enabled turns on automatic threshold adjustment.
                    type: boolean
                  pdPromptLenThreshold:
                    default: 1000
                    description: |-
                      PDPromptLenThreshold is the initial token count above which a request
                      is routed to the prefill pool. Maps to PD_PROMPT_LEN_THRESHOLD env var.
                    format: int32
                    type: integer
                type: object
              gpuBudget:
                description: |-
                  GPUBudget is the total number of GPUs available across both pools.
                  The coordinator enforces: prefill.replicas + decode.replicas <= GPUBudget.
                format: int32
                minimum: 2
                type: integer
              namespace:
                description: |-
                  Namespace is the Kubernetes namespace where the prefill and decode
                  Deployments live. Defaults to the PDRatioPolicy namespace.
                type: string
              prefill:
                description: Prefill holds configuration for the prefill worker pool.
                properties:
                  deployment:
                    description: |-
                      Deployment is the name of the prefill Deployment managed by llm-d.
                      Example: ms-pd-llm-d-modelservice-prefill
                    type: string
                  max:
                    description: Max is the maximum replica count.
                    format: int32
                    minimum: 1
                    type: integer
                  min:
                    default: 1
                    description: Min is the minimum replica count. Must be >= 1.
                    format: int32
                    minimum: 1
                    type: integer
                  queueDepthTrigger:
                    default: 5
                    description: |-
                      QueueDepthTrigger: if vllm:num_requests_waiting for prefill pods
                      exceeds this value, add a prefill replica.
                    format: int32
                    type: integer
                  queueVelocityTrigger:
                    default: 3
                    description: |-
                      QueueVelocityTrigger: if the prefill queue grows by this many requests
                      within VelocityWindowSeconds, add a prefill replica immediately.
                      This catches sudden spikes before the queue saturates.
                    format: int32
                    type: integer
                  velocityWindowSeconds:
                    default: 30
                    description: VelocityWindowSeconds is the observation window for
                      spike detection.
                    format: int32
                    type: integer
                required:
                - deployment
                - max
                - min
                type: object
              prometheusURL:
                default: http://kube-prometheus-stack-prometheus:9090
                description: PrometheusURL is the address of the Prometheus instance
                  to query.
                type: string
            required:
            - decode
            - gpuBudget
            - prefill
            type: object
          status:
            description: PDRatioPolicyStatus reflects the observed state of the controller.
            properties:
              conditions:
                description: Conditions holds standard Kubernetes condition types.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentDecodeReplicas:
                description: CurrentDecodeReplicas is the observed decode replica
                  count.
                format: int32
                type: integer
              currentPDThreshold:
                description: CurrentPDThreshold is the live value of PD_PROMPT_LEN_THRESHOLD.
                format: int32
                type: integer
              currentPrefillReplicas:
                description: CurrentPrefillReplicas is the observed prefill replica
                  count.
                format: int32
                type: integer
              desiredDecodeReplicas:
                description: DesiredDecodeReplicas is what the controller wants to
                  scale to.
                format: int32
                type: integer
              desiredPrefillReplicas:
                description: DesiredPrefillReplicas is what the controller wants to
                  scale to.
                format: int32
                type: integer
              lastBottleneck:
                description: |-
                  LastBottleneck describes which pool was detected as the bottleneck.
                  One of: "prefill", "decode", "none", "both".
                type: string
              lastScaleTime:
                description: LastScaleTime is when the last scale action was taken.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
